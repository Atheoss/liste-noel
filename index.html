<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma liste de Noël</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e9; --ink:#1f2a24; --muted:#6b736d; --card:#fffdf9;
    --red:#b8322a; --green:#1f5d43; --gold:#c9962b; --line:#e6ddcf;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;
    background-image:radial-gradient(circle at 10% 0%,#f0e2cc 0,transparent 40%),radial-gradient(circle at 100% 30%,#e9efe6 0,transparent 35%);}
  .wrap{max-width:980px;margin:0 auto;padding:48px 20px 64px}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
  .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:600}
  h1{font-family:Fraunces,serif;font-weight:800;font-size:clamp(38px,6vw,60px);line-height:1;margin:8px 0 0}
  h1 span{color:var(--green)}
  .count{font-family:Fraunces,serif;font-size:15px;color:var(--muted);text-align:right}
  .count b{display:block;font-size:30px;color:var(--ink)}
  .progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 28px}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--gold));transition:width .4s}
  .filters{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
  .filters button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font:500 14px Inter,sans-serif;cursor:pointer}
  .filters button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 1px 0 rgba(0,0,0,.03),0 10px 30px -18px rgba(60,40,10,.35);transition:transform .2s,opacity .3s}
  .card:hover{transform:translateY(-3px)}
  .photo{position:relative;aspect-ratio:4/3;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
  .photo img,.photo svg{max-width:82%;max-height:86%;object-fit:contain}
  .tag{position:absolute;top:12px;left:12px;background:var(--bg);border:1px solid var(--line);font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px}
  .body{padding:18px 18px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
  .body h2{font-family:Fraunces,serif;font-size:21px;margin:0;line-height:1.2}
  .meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:14px}
  .price{font-weight:600;color:var(--ink)}
  .note{font-size:13.5px;color:var(--muted);margin:0;line-height:1.45}
  .actions{display:flex;gap:10px;margin-top:auto;padding-top:10px}
  .btn{flex:1;text-align:center;text-decoration:none;background:var(--red);color:#fff;font-weight:600;font-size:14px;padding:11px 12px;border-radius:12px}
  .btn:hover{background:#9c271f}
  .check{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);cursor:pointer;user-select:none;border:1px solid var(--line);border-radius:12px;padding:0 12px}
  .check input{accent-color:var(--green);width:16px;height:16px}
  .card.done{opacity:.55}
  .card.done .photo::after{content:"🎁 Réservé";position:absolute;inset:auto 12px 12px auto;background:var(--green);color:#fff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px}
  footer{margin-top:36px;color:var(--muted);font-size:13px;text-align:center}
  .snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .snow span{position:absolute;top:-10px;color:#b9cbc1;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(110vh) rotate(180deg)}}
  .wrap{position:relative;z-index:1}
  @media (prefers-reduced-motion:reduce){.snow{display:none}}
</style>
</head>
<body>
<div class="snow" id="snow"></div>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Noël 2026</div>
      <h1>Ma liste <span>de Noël</span></h1>
    </div>
    <div class="count"><b id="countNum">0 / 0</b>cadeaux réservés</div>
  </header>
  <div class="progress"><i id="bar"></i></div>
  <div class="filters" role="group" aria-label="Filtrer">
    <button data-f="all" aria-pressed="true">Tout</button>
    <button data-f="todo" aria-pressed="false">À offrir</button>
    <button data-f="done" aria-pressed="false">Réservés</button>
  </div>
  <div class="grid" id="grid"></div>
  <footer>Clique sur « Voir l'article » pour ouvrir la page du produit. La case « Réservé » est mémorisée sur cet appareil.</footer>
</div>

<script>
const CABLE_SVG = `<svg viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg" aria-label="Câble USB-C 5 m">
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2b2f33"/><stop offset="1" stop-color="#4a5157"/></linearGradient></defs>
  <g fill="none" stroke="url(#g)" stroke-width="7" stroke-linecap="round">
    <ellipse cx="120" cy="92" rx="62" ry="44"/><ellipse cx="120" cy="92" rx="50" ry="34"/><ellipse cx="120" cy="92" rx="38" ry="25"/>
    <path d="M182 92 C200 92 205 60 214 40"/><path d="M58 92 C40 100 34 130 26 150"/>
  </g>
  <rect x="204" y="18" width="20" height="30" rx="5" fill="#2b2f33" transform="rotate(20 214 33)"/>
  <rect x="209" y="8" width="11" height="12" rx="3" fill="#b9c0c6" transform="rotate(20 214 33)"/>
  <rect x="16" y="144" width="20" height="30" rx="5" fill="#2b2f33" transform="rotate(15 26 159)"/>
  <rect x="20" y="170" width="11" height="10" rx="3" fill="#b9c0c6" transform="rotate(15 26 159)"/>
  <text x="120" y="98" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="18" fill="#c9962b">5 m</text>
</svg>`;

// ➜ Pour ajouter un cadeau : copie un bloc { ... } et remplis les champs.
const GIFTS = [
  { id:"manette", tag:"🎮 Gaming", name:"Manette DualSense PS5",
    shop:"Amazon", price:null,
    note:"Manette sans fil officielle PlayStation 5, rechargeable, Bluetooth. Plusieurs coloris disponibles sur la page.",
    url:"https://www.amazon.fr/DualSenseTM-PlayStation-rechargeable-Bluetooth-Compatible/dp/B09NLJCVGB/ref=sr_1_1?__mk_fr_FR=%C3%85M%C3%85%C5%BD%C3%95%C3%91&sr=8-1",
    img:"img/manette.jpg" },
  { id:"cable", tag:"🔌 Accessoire", name:"Câble de charge 5 m",
    shop:"Amazon", price:null,
    note:"Câble ZKAPOR charge rapide, longueur 5 mètres.",
    url:"https://www.amazon.fr/ZKAPOR-Charge-Rapide-Chargeur-Samsung/dp/B0DRVNQWNB/ref=sr_1_16?sr=8-16",
    svg:CABLE_SVG },
  { id:"short", tag:"🏐 Volley", name:"Short performance adulte",
    shop:"Boutique ASSM Volley", price:29,
    note:"Short noir logo ASSM Volley, taille élastiquée avec cordon, 2 poches. Commande avant le 29/11, distribution le 18/12.",
    url:"https://assm-volley.sumupstore.com/product/short-performance-adulte",
    img:"img/short.jpg" },
];

const KEY = "liste-noel-reserves";
let reserved = {};
try { reserved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e) {}
let filter = "all";

function save(){ try { localStorage.setItem(KEY, JSON.stringify(reserved)); } catch(e) {} }
const fmt = p => p == null ? "Prix sur la page" : p.toLocaleString("fr-FR",{style:"currency",currency:"EUR"});

function render(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  GIFTS.filter(g => filter==="all" || (filter==="done") === !!reserved[g.id]).forEach(g => {
    const done = !!reserved[g.id];
    const el = document.createElement("article");
    el.className = "card" + (done ? " done" : "");
    el.innerHTML = `
      <div class="photo">
        <span class="tag">${g.tag}</span>
        ${g.img ? `<img src="${g.img}" alt="${g.name}">` : g.svg}
      </div>
      <div class="body">
        <h2>${g.name}</h2>
        <div class="meta"><span>${g.shop}</span><span class="price">${fmt(g.price)}</span></div>
        <p class="note">${g.note}</p>
        <div class="actions">
          <a class="btn" href="${g.url}" target="_blank" rel="noopener">Voir l'article ↗</a>
          <label class="check"><input type="checkbox" ${done?"checked":""}> Réservé</label>
        </div>
      </div>`;
    el.querySelector("input").addEventListener("change", e => {
      if (e.target.checked) reserved[g.id] = true; else delete reserved[g.id];
      save(); render();
    });
    grid.appendChild(el);
  });
  const n = GIFTS.filter(g => reserved[g.id]).length;
  document.getElementById("countNum").textContent = `${n} / ${GIFTS.length}`;
  document.getElementById("bar").style.width = (GIFTS.length ? n/GIFTS.length*100 : 0) + "%";
}

document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".filters button").forEach(x => x.setAttribute("aria-pressed", x===b));
  render();
}));

// neige légère
const snow = document.getElementById("snow");
for (let i=0;i<28;i++){
  const s = document.createElement("span");
  s.textContent = "❄";
  s.style.left = Math.random()*100 + "vw";
  s.style.fontSize = (8 + Math.random()*12) + "px";
  s.style.opacity = .35 + Math.random()*.5;
  s.style.animationDuration = (10 + Math.random()*14) + "s";
  s.style.animationDelay = (-Math.random()*20) + "s";
  snow.appendChild(s);
}
render();
</script>
</body>
</html>
